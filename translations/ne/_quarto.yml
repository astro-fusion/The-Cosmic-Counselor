project:
  type: book
  output-dir: ../../_book/ne
  resources:
    - ../../scripts/
    - ../../styles/

# Nepali configuration
lang: ne
book:
  title: "द कस्मिक काउन्सेलर"
  subtitle: "आधुनिक समयमा नैतिक आध्यात्मिक मार्गदर्शन"
  author: "बिशाल घिमिरे"
  
  chapters:
    # Home page with all frontmatter
    - index.qmd

    # Frontmatter
    - part: "प्रारम्भिक सामग्री"
      chapters:
        - frontmatter/prologue.qmd
        - frontmatter/foreword.qmd
        - frontmatter/gratitude.qmd
        - frontmatter/preface.qmd
    
    # Main chapters
    - part: "अध्यायहरू"
      chapters:
        - chapters/chapter-01/index.qmd
        - chapters/chapter-02/index.qmd
        - chapters/chapter-03/index.qmd
        - chapters/chapter-04/index.qmd
        - chapters/chapter-05/index.qmd
        - chapters/chapter-06/index.qmd
        - chapters/chapter-07/index.qmd
        - chapters/chapter-08/index.qmd
        - chapters/chapter-09/index.qmd
        - chapters/chapter-10/index.qmd
        - chapters/chapter-11/index.qmd
        - chapters/chapter-12/index.qmd
    
    # Backmatter
    - part: "परिशिष्ट"
      chapters:
        - backmatter/references.qmd
        - backmatter/crisis-resources.qmd
        - backmatter/author.qmd
        - backmatter/summary.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - ../../styles/global.css
    toc: true
    toc-depth: 2
    number-sections: true
    lang: ne
    
  pdf:
    pdf-engine: xelatex
    mainfont: "Devanagari Sangam MN"
    documentclass: book
    classoption:
      - 11pt
      - twoside
      - openright
    toc: true
    number-sections: true
    keep-tex: false
    geometry:
      - top=0.9in
      - bottom=0.9in
      - inner=1.15in
      - outer=0.85in
      - bindingoffset=0.2in
    fontsize: 11pt
    linestretch: 1.25
    include-in-header:
      - text: |
          \usepackage{enumitem}
          \usepackage{amsmath}
          \usepackage{amsfonts}
          \usepackage{amssymb}
          \usepackage{scrlayer-scrpage}
          \clearpairofpagestyles
          \makeatletter
          \if@twoside
            \lehead{\small\upshape\pagemark\quad\rule[-0.2ex]{0.4pt}{1em}\quad\itshape\headmark}
            \rohead{\small\itshape\headmark\quad\rule[-0.2ex]{0.4pt}{1em}\quad\upshape\pagemark}
            \cfoot[\small\upshape\pagemark]{}
          \else
            \chead{\small\itshape\headmark}
            \cfoot{\small\upshape\pagemark}
          \fi
          \makeatother
          \pagestyle{scrheadings}
    
  epub:
    toc: true
    number-sections: true
    lang: ne

  docx:
    toc: true
    number-sections: true
    highlight-style: github

# GitHub Pages configuration  
website:
  site-url: "https://astro-fusion.github.io/The-Cosmic-Counselor/ne"
  repo-url: "https://github.com/astro-fusion/The-Cosmic-Counselor"
  title: "द कस्मिक काउन्सेलर"
  navbar:
    title: "द कस्मिक काउन्सेलर"
    right:
      - icon: github
        href: https://github.com/astro-fusion/The-Cosmic-Counselor

publish:
  - provider: gh-pages
    url: "https://astro-fusion.github.io/The-Cosmic-Counselor/ne"